version: '3.8'

services:
  backend:
    build: ./backend
    container_name: orgcell-backend
    restart: unless-stopped
    command: sh -c "node /app/run_migration.js && node server.js"
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - FS_APP_KEY=${FS_APP_KEY}
      - FS_AUTH_BASE=${FS_AUTH_BASE}
      - FS_API_BASE=${FS_API_BASE}
    volumes:
      - uploads:/app/uploads
      - ./database:/app/database
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: orgcell-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: orgcell-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=orgcell
      - POSTGRES_USER=orgcell_user
      - POSTGRES_PASSWORD=orgcell_secure_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgcell_user -d orgcell"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  uploads:
